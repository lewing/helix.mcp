name: Zizmor (Actions security)

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
      - ".github/dependabot.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
      - ".github/dependabot.yml"

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          # Enforce SHA-pinning (unpinned-uses) and other real findings, but
          # don't fail CI on informational notes or low-confidence findings
          # (e.g. artipacked). Accepted exceptions live in .github/zizmor.yml.
          min-severity: low
          min-confidence: medium
          # Avoid requiring GitHub Advanced Security / code-scanning upload.
          advanced-security: false
          config: .github/zizmor.yml
          online-audits: "false"
